name: SQP-1 WEB (1080p) Streaming Optimized
description: '**TRaSH Guides:**


  - You run a second "Streaming Optimized" instance of Radarr and want both versions,
  or you just want streaming-optimized 1080p overall.

  - You want fewer upgrades than with SQP-1 because the WEBDL is often watched before
  the BHDStudio Blu-ray is released.

  - You desire good compatibility across various playback devices without compromising
  release quality.

  - You want little to no transcoding for low-powered devices or remote streaming.

  - Smaller file sizes and bitrates ( the same quality as you would get with official
  streaming services).

  - Easier to obtain even without access to top-tier trackers or indexers.

  - You prefer Dolby Digital Plus (Atmos) audio over Dolby Digital, as WEB-DLs commonly
  come with Dolby Digital Plus (Atmos) audio.

  - You prefer IMAX-Enhanced.

  - You prefer included embedded subtitles.

  - More cross-seed hits, as WEBDL is more widespread over the trackers.


  **BHDStudio release HQ 1080p Encodes with the following features:**


  -Streaming optimized (Optimized for PLEX, emby, Jellyfin, and other streaming platforms)

  -AC3 Audio (Downmixed Lossless audio track to Dolby Digital 5.1 for optimal compatibility)

  -Small sizes

  -Good quality


  If you don''t have access to the top tier indexers, you won''t have access to all
  BHDStudio releases. WEB releases, however, have much better general availability.


  **hallowed release HQ 1080p encodes with the following features:**


  - Highly streamable releases with some more modern optimizations:

  - Dolby Digital Plus multichannel or AAC mono/stereo audio (converted from lossless
  audio track)

  - Included English SRT subtitles, as well as a selection of PGS subtitles in English
  and other languages

  - Dual audio for foreign films

  - Smaller sizes

  - Good quality


  hallowed''s releases have very good general availability.'
